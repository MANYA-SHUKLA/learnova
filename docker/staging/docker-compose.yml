# Staging skeleton — wire CI images + managed Mongo/Redis secrets in deployment.
services:
  api:
    image: learnova/api:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file:
      - ../../backend/.env.staging
    ports:
      - '4000:4000'
    depends_on:
      - worker

  worker:
    image: learnova/worker:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file:
      - ../../worker/.env.staging

  frontend:
    image: learnova/frontend:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file:
      - ../../frontend/.env.staging
    ports:
      - '3000:3000'
    depends_on:
      - api
