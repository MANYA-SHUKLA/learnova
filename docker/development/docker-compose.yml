services:
  mongodb:
    image: mongo:7
    container_name: learnova-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: learnova
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: learnova-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional local Judge0 — enable when coding platform work begins
  # judge0:
  #   image: judge0/judge0:1.13.0
  #   ports:
  #     - '2358:2358'
  #   privileged: true

volumes:
  mongo_data:
  redis_data:
