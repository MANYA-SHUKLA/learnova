# Judge0 CE — required for real Practice Lab code execution.
# Start: pnpm docker:judge0
# API:   http://localhost:2358
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.0
    container_name: learnova-judge0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - '2358:2358'
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      - db
      - redis

  worker:
    image: judge0/judge0:1.13.0
    container_name: learnova-judge0-worker
    command: ['./scripts/workers']
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: postgres:16.2
    container_name: learnova-judge0-db
    env_file: judge0.conf
    volumes:
      - judge0_pg:/var/lib/postgresql/data/
    <<: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    container_name: learnova-judge0-redis
    command:
      [
        'bash',
        '-c',
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: judge0.conf
    <<: *default-logging
    restart: unless-stopped

volumes:
  judge0_pg:
