# Render — when Root Directory is set to `backend`
#
# Render UI settings:
#   Root Directory: backend
#   Build Command:  bash scripts/render-build.sh
#   Start Command:  bash scripts/render-start.sh
#   Health Check:   /api/v1/live
#
# The scripts always `cd` to the monorepo root so pnpm workspace packages resolve.
# Prefer the root `render.yaml` blueprint when possible.

runtime: node
buildCommand: bash scripts/render-build.sh
startCommand: bash scripts/render-start.sh
healthCheckPath: /api/v1/live
